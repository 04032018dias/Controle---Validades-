<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.webmanifest">
<title>Controle de Validades</title>
<style>
:root{--bg:#f4f6f8;--ink:#1f2937;--blue:#17324d;--red:#ffe1e1;--green:#e4f4e6;--gray:#e7e7e7;--muted:#667085}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--blue);color:white;padding:15px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:20px}header p{margin:3px 0 0;font-size:12px;opacity:.85}
main{max-width:920px;margin:auto;padding:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px;font-weight:750;background:white;box-shadow:0 1px 4px #0002}button.primary{background:var(--blue);color:white}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 4px #0001}.stat b{display:block;font-size:21px}.small{font-size:12px;color:var(--muted)}
.search{width:100%;padding:12px;border:1px solid #ccd3dd;border-radius:10px;margin-bottom:12px;font-size:16px}.card{border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 5px #0001}.red{background:var(--red)}.green{background:var(--green)}.gray{background:var(--gray)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.name{font-weight:800}.meta{font-size:13px;margin-top:3px}.badge{font-size:12px;font-weight:800;padding:6px 8px;background:#fff8;border-radius:999px;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{padding:8px 9px;font-size:12px}
dialog{border:0;border-radius:16px;width:calc(100% - 24px);max-width:520px;padding:0}dialog::backdrop{background:#0008}.modal{padding:16px}label{display:block;font-size:13px;font-weight:750;margin:11px 0 5px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.notice{background:#fff7d6;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}.hidden{display:none!important}#saveState{font-size:12px;margin-top:5px;opacity:.9}
@media(min-width:700px){.toolbar{grid-template-columns:repeat(6,1fr)}}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}header,.toolbar,.search,.actions,dialog{display:none!important}body{background:#fff!important}main{max-width:none;padding:0}.card,.stat{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.card.red{background:#ffe1e1!important}.card.green{background:#e4f4e6!important}.card.gray{background:#e7e7e7!important}}
</style>
</head>
<body>
<header><h1>Controle de Validades</h1><p>🔴 até 20 dias • 🟢 mais de 20 dias</p><div id="saveState">Preparando armazenamento…</div></header>
<main>
<div class="toolbar">
<button class="primary" id="btnAdd">➕ Cadastrar</button>
<button id="btnPhoto">📸 Foto do código</button>
<button id="btnPdf">📄 Gerar PDF</button>
<button id="btnRemoved">📦 Retirados</button>
<button id="btnBackup">💾 Backup</button>
<button id="btnRestore">📥 Restaurar</button>
</div>
<input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment">
<input id="restoreInput" class="hidden" type="file" accept="application/json,.json">
<div class="stats"><div class="stat"><b id="sTotal">0</b><span class="small">Ativos</span></div><div class="stat"><b id="sRed">0</b><span class="small">Até 20 dias</span></div><div class="stat"><b id="sGreen">0</b><span class="small">Mais de 20 dias</span></div></div>
<input id="search" class="search" placeholder="Buscar produto ou código...">
<div id="list"></div>
</main>

<dialog id="dlg"><div class="modal">
<h2 id="title">Cadastrar produto</h2>
<input id="editId" type="hidden">
<label>Nome do produto</label><input id="name" placeholder="Ex.: Iogurte morango">
<label>Código de barras</label><input id="barcode" inputmode="numeric" placeholder="789...">
<label>Data de validade</label><input id="expiry" type="date">
<label>Status</label><select id="status"><option value="active">Ativo</option><option value="removed">Retirado</option></select>
<div class="notice">Nesta versão os dados são gravados no banco interno do navegador (IndexedDB), que é mais confiável que o salvamento usado antes.</div>
<div class="actions"><button class="primary" id="btnSave">Salvar</button><button id="btnCancel">Cancelar</button></div>
</div></dialog>

<script>
const STARTER=[{"expiry": "2026-08-18", "barcode": "7896691101002", "name": ""}, {"expiry": "2026-08-23", "barcode": "7891025109907", "name": ""}, {"expiry": "2026-08-28", "barcode": "7896862002060", "name": ""}, {"expiry": "2026-08-29", "barcode": "7898460935979", "name": ""}, {"expiry": "2026-08-31", "barcode": "7896625212514", "name": ""}, {"expiry": "2026-09-01", "barcode": "7891000110430", "name": ""}, {"expiry": "2026-09-05", "barcode": "7896691101535", "name": ""}, {"expiry": "2026-09-05", "barcode": "7891000261026", "name": ""}, {"expiry": "2026-09-07", "barcode": "7891097089527", "name": ""}, {"expiry": "2026-09-07", "barcode": "7896625210466", "name": ""}, {"expiry": "2026-09-07", "barcode": "7896625210473", "name": ""}, {"expiry": "2026-09-10", "barcode": "7896862002732", "name": ""}, {"expiry": "2026-09-10", "barcode": "7891025119524", "name": ""}, {"expiry": "2026-09-10", "barcode": "7891025110938", "name": ""}, {"expiry": "2026-09-12", "barcode": "7891097087431", "name": ""}, {"expiry": "2026-09-12", "barcode": "7898460935993", "name": ""}, {"expiry": "2026-09-12", "barcode": "7891000360668", "name": ""}, {"expiry": "2026-09-14", "barcode": "7891025106067", "name": ""}, {"expiry": "2026-09-15", "barcode": "7891025125495", "name": ""}, {"expiry": "2026-09-18", "barcode": "7891097087448", "name": ""}, {"expiry": "2026-09-18", "barcode": "7891000360323", "name": ""}, {"expiry": "2026-09-22", "barcode": "7891025125488", "name": ""}, {"expiry": "2026-09-23", "barcode": "7891000103931", "name": ""}, {"expiry": "2026-09-24", "barcode": "7891025121640", "name": ""}, {"expiry": "2026-09-25", "barcode": "7891000252833", "name": ""}, {"expiry": "2026-09-27", "barcode": "7891097087455", "name": ""}, {"expiry": "2026-09-29", "barcode": "7891000244265", "name": ""}];
const DB_NAME='controleValidadesDB';
const STORE='products';
let db=null, showRemoved=false;

const $=id=>document.getElementById(id);
function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)}
function setState(t){$('saveState').textContent=t}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(s){const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function days(s){const [y,m,d]=s.split('-').map(Number),t=new Date(y,m-1,d),n=new Date();t.setHours(0,0,0,0);n.setHours(0,0,0,0);return Math.round((t-n)/86400000)}

function openDB(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open(DB_NAME,1);
   req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};
   req.onsuccess=e=>resolve(e.target.result);
   req.onerror=e=>reject(e.target.error);
 });
}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function allProducts(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function putProduct(p){return new Promise((res,rej)=>{const r=tx('readwrite').put(p);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function deleteById(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearAll(){return new Promise((res,rej)=>{const r=tx('readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function seedIfNeeded(){
 const data=await allProducts();
 if(data.length)return;
 for(const x of STARTER) await putProduct({...x,id:uid(),status:'active'});
}
async function render(){
 const q=$('search').value.toLowerCase().trim();
 let d=await allProducts();
 const active=d.filter(x=>x.status!=='removed');
 $('sTotal').textContent=active.length;$('sRed').textContent=active.filter(x=>days(x.expiry)>=0&&days(x.expiry)<=20).length;$('sGreen').textContent=active.filter(x=>days(x.expiry)>20).length;
 d=d.filter(x=>showRemoved?x.status==='removed':x.status!=='removed');
 if(q)d=d.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.barcode||'').includes(q));
 d.sort((a,b)=>a.expiry.localeCompare(b.expiry));
 $('list').innerHTML=d.length?d.map(x=>{const n=days(x.expiry),cls=x.status==='removed'||n<0?'gray':n<=20?'red':'green';const label=x.status==='removed'?'Retirado':n<0?'Vencido':n===0?'Vence hoje':`${n} dias`;return `<div class="card ${cls}"><div class="row"><div><div class="name">${esc(x.name)||'Produto sem nome'}</div><div class="meta">Código: ${esc(x.barcode)}<br>Validade: ${fmt(x.expiry)}</div><div class="actions"><button onclick="editItem('${x.id}')">Editar</button>${x.status!=='removed'?`<button onclick="removeItem('${x.id}')">Retirar</button>`:''}<button onclick="eraseItem('${x.id}')">Excluir</button></div></div><span class="badge">${label}</span></div></div>`}).join(''):'<div class="notice">Nenhum produto encontrado.</div>';
}
function openForm(code=''){$('title').textContent='Cadastrar produto';$('editId').value='';$('name').value='';$('barcode').value=code;$('expiry').value='';$('status').value='active';$('dlg').showModal()}
async function editItem(id){const d=await allProducts(),x=d.find(p=>p.id===id);if(!x)return;$('title').textContent='Editar produto';$('editId').value=id;$('name').value=x.name||'';$('barcode').value=x.barcode||'';$('expiry').value=x.expiry||'';$('status').value=x.status||'active';$('dlg').showModal()}
window.editItem=editItem;
async function saveForm(){
 const id=$('editId').value,name=$('name').value.trim(),barcode=$('barcode').value.trim(),expiry=$('expiry').value,status=$('status').value;
 if(!barcode||!expiry){alert('Informe o código de barras e a validade.');return}
 const d=await allProducts(),dup=d.find(x=>x.barcode===barcode&&x.id!==id);
 if(dup&&!id){alert('Esse código já está cadastrado. Vou abrir o cadastro existente.');$('dlg').close();editItem(dup.id);return}
 try{setState('Salvando…');await putProduct({id:id||uid(),name,barcode,expiry,status});setState('✅ Salvo neste aparelho');$('dlg').close();await render()}catch(e){setState('❌ Falha ao salvar');alert('Não consegui gravar os dados neste navegador.')} 
}
async function removeItem(id){const d=await allProducts(),x=d.find(p=>p.id===id);if(!x)return;x.status='removed';await putProduct(x);setState('✅ Salvo neste aparelho');render()}
window.removeItem=removeItem;
async function eraseItem(id){if(confirm('Excluir este produto?')){await deleteById(id);setState('✅ Alteração salva');render()}}
window.eraseItem=eraseItem;

async function decodeBarcode(file){
 if(!('BarcodeDetector' in window))return null;
 try{const img=await createImageBitmap(file),formats=await BarcodeDetector.getSupportedFormats(),wanted=['ean_13','ean_8','code_128','upc_a','upc_e'].filter(f=>formats.includes(f)),det=new BarcodeDetector({formats:wanted.length?wanted:formats}),codes=await det.detect(img);return codes[0]?.rawValue||null}catch(e){return null}
}
$('photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const code=await decodeBarcode(f);if(code){const d=await allProducts(),x=d.find(p=>p.barcode===code);x?editItem(x.id):openForm(code)}else{alert('Não consegui ler o código. Digite o número manualmente.');openForm()}e.target.value=''};

async function backup(){
 const data=await allProducts(),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-controle-validades.json';a.click();URL.revokeObjectURL(a.href)
}
$('restoreInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const data=JSON.parse(r.result);await clearAll();for(const x of data)await putProduct(x);setState('✅ Backup restaurado');render()}catch{alert('Backup inválido.')}};r.readAsText(f);e.target.value=''};

$('btnAdd').onclick=()=>openForm();$('btnPhoto').onclick=()=>$('photoInput').click();$('btnPdf').onclick=()=>window.print();$('btnRemoved').onclick=()=>{showRemoved=!showRemoved;render()};$('btnBackup').onclick=backup;$('btnRestore').onclick=()=>$('restoreInput').click();$('btnSave').onclick=saveForm;$('btnCancel').onclick=()=>$('dlg').close();$('search').oninput=render;

(async()=>{
 try{db=await openDB();await seedIfNeeded();setState('✅ Armazenamento pronto');await render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){setState('❌ Abra pelo Chrome em um link online');alert('Esta versão precisa ser aberta no Chrome em um endereço online para salvar com segurança.')} 
})();
</script>
</body>
</html>
